{% extends "layout.html" %}
{% block title %}质谱匹配{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/maldi_matching.css') }}">
{% endblock %}

{% block content %}
<div class="maldi-matching-page">

    <!-- 消息提示 -->
    <div id="message-container"></div>

    <!-- 第一行：质谱匹配区域 -->
    <div class="row">
        <!-- 左侧：文件上传和匹配 -->
        <div class="card matching-card">
            <div class="card-header">
                <h4>🧪 质谱匹配</h4>
            </div>
            <div class="card-content">

                <!-- 文件上传区域 -->
                <div class="upload-section">
                    <label class="upload-label">上传质谱文件 (TXT)</label>
                    <div class="upload-area" id="upload-area">
                        <input type="file" id="spectrum-file" accept=".txt" style="display: none;">
                        <div class="upload-placeholder" id="upload-placeholder">
                            <div class="upload-icon">📁</div>
                            <p>点击选择或拖拽 TXT 文件到此处</p>
                            <small>支持格式: .txt</small>
                        </div>
                        <div class="file-info" id="file-info" style="display: none;">
                            <div class="file-icon">📄</div>
                            <div class="file-details">
                                <div class="file-name" id="file-name"></div>
                                <div class="file-meta">
                                    <span id="file-size"></span>
                                    <button type="button" class="btn-remove" id="btn-remove-file">✕</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 参数设置 -->
                <div class="params-section">
                    <div class="param-group">
                        <label>返回结果数 (Top-K)</label>
                        <input type="number" id="param-topk" value="3" min="1" max="10" class="param-input">
                    </div>
                    <div class="param-group">
                        <label>m/z 容差 (Da)</label>
                        <input type="number" id="param-tolerance" value="0.5" min="0.1" max="2.0" step="0.1" class="param-input">
                    </div>
                </div>

                <!-- 匹配按钮 -->
                <button type="button" class="btn-primary btn-match" id="btn-match" disabled>
                    开始匹配
                </button>

                <!-- 匹配结果 -->
                <div class="results-section" id="results-section" style="display: none;">
                    <div class="section-header">
                        <h5>匹配结果</h5>
                    </div>
                    <div class="results-list" id="results-list">
                        <!-- 结果将动态插入这里 -->
                    </div>
                </div>

            </div>
        </div>

        <!-- 右侧：参考谱管理 -->
        <div class="card reference-card">
            <div class="card-header">
                <h4>📚 参考谱库管理</h4>
            </div>
            <div class="card-content">

                <!-- 添加参考谱 -->
                <div class="add-reference-section">
                    <div class="section-header">
                        <h5>添加参考谱</h5>
                    </div>
                    <div class="add-form">
                        <div class="form-group">
                            <label>选择菌种</label>
                            <select id="ref-strain-select" class="form-select">
                                <option value="">请选择菌种</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>质谱文件 (TXT)</label>
                            <input type="file" id="ref-file" accept=".txt" class="form-input">
                        </div>
                        <button type="button" class="btn-secondary btn-add-ref" id="btn-add-ref" disabled>
                            添加参考谱
                        </button>
                    </div>
                </div>

                <!-- 参考谱列表 -->
                <div class="reference-list-section">
                    <div class="section-header">
                        <h5>参考谱列表 (<span id="ref-count">0</span>)</h5>
                    </div>
                    <div class="reference-list" id="reference-list">
                        <div class="empty-state">
                            <p>暂无参考谱</p>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

</div>

<!-- 加载指示器 -->
<div class="loading-overlay" id="loading-overlay" style="display: none;">
    <div class="loading-spinner"></div>
    <div class="loading-text">处理中...</div>
</div>

{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/maldi_matching.js') }}"></script>
{% endblock %}
